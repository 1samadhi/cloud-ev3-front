server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La consola es una SPA: las rutas (/pagos, /kafka, /callback) no son
    # archivos en disco. Sin este fallback, recargar cualquier ruta daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.js lo genera el entrypoint en cada arranque, asi que NO debe quedar
    # en la cache del navegador: si se cachea, un cambio de entorno (local a AWS)
    # no tomaria efecto hasta un refresco forzado.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Los assets compilados llevan hash en el nombre, asi que son inmutables:
    # un deploy nuevo cambia el nombre del archivo y la cache no estorba.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Punto de chequeo para saber si el contenedor esta sirviendo.
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # El contenedor NO sirve la API: el navegador llama a los microservicios (o a
    # API Gateway) directamente, y por eso el CORS se declara del lado de los
    # servicios. Aca no va ningun proxy_pass: la observacion del docente en la
    # EV2 fue justamente "no usar Proxy en backend".
}
