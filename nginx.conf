server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index consola.html;

    # consola.html es la unica pagina: cualquier ruta desconocida la devuelve.
    # Sin esto, recargar una ruta que no es un archivo daria 404.
    location / {
        try_files $uri $uri/ /consola.html;
    }

    # config.js lo genera el entrypoint en cada arranque, asi que NO debe
    # quedar en la cache del navegador: si se cachea, un cambio de entorno
    # (local a AWS) no tomaria efecto hasta un refresco forzado.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Punto de chequeo para saber si el contenedor esta sirviendo.
    location = /salud {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/html text/css application/javascript;

    # El contenedor no sirve la API: el navegador llama a los microservicios
    # (o a API Gateway) directamente, y por eso el CORS se declara del lado
    # de los servicios. Aca NO va ningun proxy_pass: la observacion del
    # docente en la EV2 fue justamente "no usar Proxy en backend".
}
